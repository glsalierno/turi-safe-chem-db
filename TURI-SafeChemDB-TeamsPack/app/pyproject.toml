[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turi-safe-chem-db"
version = "0.1.0"
description = "TURI Safe Chem DB - DoSS on-demand and hazard tooling monorepo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gabriel Salierno" }]
dependencies = [
  "streamlit>=1.28.0,<2",
  "pandas>=2.0.0",
  "requests>=2.31.0",
  "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
  "vulture>=2.10",
  "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["packages*"]
