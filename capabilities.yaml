# Capability Registry — TURI Safe Chem DB
# Machine-readable registry of all features/capabilities with status, tests, and env vars.
# See CAPABILITIES.md for human-readable documentation.
#
# Status values:
#   active      — Implemented and tested on main
#   TODO        — Planned; must be filled by referenced PR before merge
#   stub        — Module exists but feature not yet functional
#   optional    — Works when external data/license is configured; skip otherwise
#   licensed    — Requires proprietary software/data; skip in CI

capabilities:

  # ─────────────────────────────────────────────────────────────────────────────
  # PubChem API capabilities
  # ─────────────────────────────────────────────────────────────────────────────

  pubchem_pug_rest:
    name: "PubChem PUG-REST (throttled)"
    description: "CAS→CID lookup, identity, and physchem properties via PubChem PUG REST API"
    module: "packages.doss_core.pubchem"
    required: true
    licensed: false
    env_vars:
      - "PUBCHEM_MIN_INTERVAL_S"
      - "PUBCHEM_MAX_RETRIES"
      - "PUBCHEM_CACHE_DIR"
      - "PUBCHEM_CACHE_MAX_AGE_S"
    test_id: "test_capabilities::test_pubchem_pug_rest"
    status: "active"

  pubchem_pug_view_ghs:
    name: "PubChem PUG-View GHS/NFPA"
    description: "Extended hazard data (GHS codes, NFPA ratings) via PUG View API"
    module: "packages.doss_core.pubchem"
    required: true
    licensed: false
    env_vars:
      - "PUBCHEM_MIN_INTERVAL_S"
      - "PUBCHEM_CACHE_DIR"
    test_id: "test_capabilities::test_pubchem_pug_view_ghs"
    status: "active"

  pubchem_ftp_bulk:
    name: "PubChem FTP bulk index"
    description: "Bulk compound index via PubChem FTP for offline lookups"
    module: "packages.doss_core.pubchem_bulk"
    required: false
    licensed: false
    env_vars:
      - "PUBCHEM_BULK_DIR"
      - "PUBCHEM_DISABLE_BULK"
    test_id: "test_capabilities::test_pubchem_ftp_bulk"
    pr: "#7"
    status: "TODO"

  # ─────────────────────────────────────────────────────────────────────────────
  # P2OASys scoring capabilities
  # ─────────────────────────────────────────────────────────────────────────────

  p2oasys_score_lookup:
    name: "P2OASys score lookup (SQLite)"
    description: "Expert/auto P2OASys overall scores from bundled SQLite database"
    module: "packages.p2oasys_core.lookup"
    required: true
    licensed: false
    env_vars:
      - "P2OASYS_SCORE_LOOKUP_DB"
      - "EXPERT_P2OASYS_CSV"
    test_id: "test_capabilities::test_p2oasys_score_lookup"
    status: "active"

  p2oasys_matrix_scorer:
    name: "P2OASys matrix + scorer"
    description: "Full P2OASys hazard matrix computation and scoring"
    module: "packages.p2oasys_core.scorer"
    required: false
    licensed: false
    env_vars:
      - "P2OASYS_MATRIX_DIR"
    test_id: "test_capabilities::test_p2oasys_matrix_scorer"
    pr: "#8"
    status: "TODO"

  # ─────────────────────────────────────────────────────────────────────────────
  # SDS enrichment capabilities
  # ─────────────────────────────────────────────────────────────────────────────

  fisher_sds_enrich:
    name: "Fisher SDS enrich"
    description: "On-demand Fisher Scientific SDS/catalog enrichment (NFPA, pricing, physchem)"
    module: "packages.doss_core.fisher"
    required: false
    licensed: false
    env_vars:
      - "DOSS_ENABLE_FISHER"
    test_id: "test_capabilities::test_fisher_sds_enrich"
    status: "active"

  tci_sds_enrich:
    name: "TCI SDS enrich"
    description: "On-demand TCI SDS/catalog enrichment (NFPA, physchem, pricing)"
    module: "packages.doss_core.tci"
    required: false
    licensed: false
    env_vars: []
    test_id: "test_capabilities::test_tci_sds_enrich"
    status: "active"

  sigma_sds_enrich:
    name: "Sigma-Aldrich SDS enrich"
    description: "Sigma-Aldrich/MilliporeSigma SDS enrichment (STUB — access pending)"
    module: "packages.doss_core.sigma"
    required: false
    licensed: false
    env_vars: []
    test_id: "test_capabilities::test_sigma_sds_enrich"
    status: "stub"

  # ─────────────────────────────────────────────────────────────────────────────
  # HSPiP Hansen Solubility Parameters
  # ─────────────────────────────────────────────────────────────────────────────

  hspip_sofx_lookup:
    name: "HSPiP sofx D/P/H/RER lookup"
    description: "Local HSPiP .sofx file lookup for Hansen parameters (D/P/H/RER)"
    module: "packages.doss_core.hspip"
    required: false
    licensed: true
    env_vars:
      - "HSPIP_DATA"
      - "HSPIP_DATA_DIR"
    test_id: "test_capabilities::test_hspip_sofx_lookup"
    status: "optional"

  hspip_cli:
    name: "HSPiP CLI (Y-MBSX)"
    description: "HSPiP.exe CLI for computing D/P/H from SMILES (licensed, optional)"
    module: "packages.doss_core.hspip"
    required: false
    licensed: true
    env_vars:
      - "HSPIP_EXE"
      - "HSPIP_PATH"
    test_id: "test_capabilities::test_hspip_cli"
    status: "optional"

  glove_hsp_screen:
    name: "Glove HSP polymer screen"
    description: "HSP-based glove polymer compatibility screening (RED calculation)"
    module: "packages.doss_core.glove_hsp"
    required: false
    licensed: false
    env_vars: []
    test_id: "test_capabilities::test_glove_hsp_screen"
    status: "active"

  # ─────────────────────────────────────────────────────────────────────────────
