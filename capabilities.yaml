  # ─────────────────────────────────────────────────────────────────────────────
  # Core application
  # ─────────────────────────────────────────────────────────────────────────────

  doss_app:
    name: "DoSS on-demand app"
    description: "Streamlit DoSS row generator application"
    module: "apps.doss_ondemand.app"
    required: true
    licensed: false
    env_vars:
      - "DOSS_ENABLE_FISHER"
