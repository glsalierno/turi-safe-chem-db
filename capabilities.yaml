    module: "packages.scorer.cameo_nfpa"
    required: false
    licensed: false
    env_vars:
      - "CAMEO_NFPA_DB"
    test_id: "test_capabilities::test_cameo_nfpa_sqlite"
    pr: "#8"
    status: "TODO"

  iarc_table:
