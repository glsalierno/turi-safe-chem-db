    module: "packages.scorer.iarc"
    required: false
    licensed: false
    env_vars:
      - "IARC_TABLE_PATH"
    test_id: "test_capabilities::test_iarc_table"
    pr: "#8"
    status: "TODO"

  odp_gwp_ipcc:
    name: "ODP/GWP/IPCC atmo tables"
    description: "Ozone Depletion Potential and Global Warming Potential tables"
    module: "packages.scorer.atmo_tables"
    required: false
    licensed: false
    env_vars:
      - "ODP_GWP_TABLE_PATH"
    test_id: "test_capabilities::test_odp_gwp_ipcc"
    pr: "#8"
    status: "TODO"

  caa_hap_list:
    name: "CAA HAP list"
    description: "Clean Air Act Hazardous Air Pollutants list lookup"
    module: "packages.scorer.caa_hap"
    required: false
    licensed: false
    env_vars:
      - "CAA_HAP_LIST_PATH"
    test_id: "test_capabilities::test_caa_hap_list"
    pr: "#8"
    status: "TODO"

  # ─────────────────────────────────────────────────────────────────────────────
  # External tools (optional, licensed)
  # ─────────────────────────────────────────────────────────────────────────────

  ecosar_pyepisuite:
    name: "ECOSAR/pyepisuite (optional)"
    description: "ECOSAR aquatic toxicity and EPI Suite property estimation"
    module: "packages.ecosar.pyepisuite"
    required: false
    licensed: true
    env_vars:
      - "EPISUITE_PATH"
      - "ECOSAR_DISABLE"
    test_id: "test_capabilities::test_ecosar_pyepisuite"
    pr: "#6"
    status: "TODO"

  # ─────────────────────────────────────────────────────────────────────────────
  # IUCLID dossier access
  # ─────────────────────────────────────────────────────────────────────────────

  iuclid_dossiers:
    name: "IUCLID dossiers"
